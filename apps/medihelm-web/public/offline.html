<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MédiHelm — Hors ligne</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; background: #f8fafc; color: #1e293b;
    }
    .container { text-align: center; padding: 2rem; max-width: 500px; }
    .logo { width: 80px; height: 80px; margin: 0 auto 1.5rem; border-radius: 16px; background: #0ea5e9; display: flex; align-items: center; justify-content: center; }
    .logo svg { width: 48px; height: 48px; fill: white; }
    h1 { font-size: 1.5rem; margin-bottom: 0.75rem; }
    p { color: #64748b; margin-bottom: 1.5rem; line-height: 1.6; }
    .btn {
      display: inline-block; padding: 0.75rem 2rem;
      background: #0ea5e9; color: white; border: none;
      border-radius: 8px; font-size: 1rem; cursor: pointer;
      text-decoration: none;
    }
    .btn:hover { background: #0284c7; }
    .status { margin-top: 1.5rem; font-size: 0.875rem; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-1 11h-4v4h-4v-4H6v-4h4V6h4v4h4v4z"/></svg>
    </div>
    <h1>Vous êtes hors ligne</h1>
    <p>MédiHelm fonctionne en mode hors ligne. Vos données locales sont disponibles et vos modifications seront synchronisées automatiquement quand la connexion sera rétablie.</p>
    <button class="btn" onclick="window.location.reload()">Réessayer</button>
    <div class="status" id="status"></div>
  </div>
  <script>
    function updateStatus() {
      document.getElementById('status').textContent = navigator.onLine
        ? 'Connexion rétablie — rechargement...'
        : 'Toujours hors ligne';
      if (navigator.onLine) {
        setTimeout(() => window.location.reload(), 1000);
      }
    }
    window.addEventListener('online', updateStatus);
    window.addEventListener('offline', updateStatus);
  </script>
</body>
</html>
